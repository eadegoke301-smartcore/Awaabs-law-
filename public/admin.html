<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Damp and Mould Reports</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="container">
    <h1>Admin — Reports</h1>
  </header>

  <main class="container">
    <section class="card">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search postcode or category…" />
      </div>
      <div class="table-wrap">
        <table id="reportsTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Created</th>
              <th>Postcode</th>
              <th>Category</th>
              <th>Severity</th>
              <th>Status</th>
              <th>Investigate by</th>
              <th>Start repairs by</th>
              <th>Emergency by</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="detail" class="card hidden"></section>
  </main>

  <script src="/admin.js" defer></script>
</body>
</html>
